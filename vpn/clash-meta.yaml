mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies:
  - name: "⚡ VPS-80-VMess直连"
    type: vmess
    server: 192.220.21.39
    port: 80
    uuid: aff9497a-050e-48b5-bf41-205112072d90
    alterId: 0
    cipher: auto
    udp: true
    tls: false
    network: ws
    ws-opts:
      path: /ray

  - name: "🚀 VPS-443-Reality"
    type: vless
    server: 192.220.21.39
    port: 443
    uuid: aff9497a-050e-48b5-bf41-205112072d90
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: iB1xt7fsDEdDBSKdE7dqRBZq5Z8yb4U2c3x-FnvUb1c
      short-id: 21a62e22

  - name: "🛡️ VPS-8443-Reality"
    type: vless
    server: 192.220.21.39
    port: 8443
    uuid: aff9497a-050e-48b5-bf41-205112072d90
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: iB1xt7fsDEdDBSKdE7dqRBZq5Z8yb4U2c3x-FnvUb1c
      short-id: 21a62e22

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "AUTO"
      - "⚡ VPS-80-VMess直连"
      - "🚀 VPS-443-Reality"
      - "🛡️ VPS-8443-Reality"
      - DIRECT

  - name: "AUTO"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 60
    tolerance: 50
    proxies:
      - "⚡ VPS-80-VMess直连"
      - "🚀 VPS-443-Reality"
      - "🛡️ VPS-8443-Reality"

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-SUFFIX,baidu.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,weixin.qq.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - DOMAIN-SUFFIX,tmall.com,DIRECT
  - DOMAIN-SUFFIX,alipay.com,DIRECT
  - DOMAIN-SUFFIX,alicdn.com,DIRECT
  - DOMAIN-SUFFIX,jd.com,DIRECT
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,163.com,DIRECT
  - DOMAIN-SUFFIX,126.com,DIRECT
  - DOMAIN-SUFFIX,douyin.com,DIRECT
  - DOMAIN-SUFFIX,feishu.cn,DIRECT
  - MATCH,PROXY
