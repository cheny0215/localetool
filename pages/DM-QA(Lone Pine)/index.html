<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键QA</title>
    <link rel="stylesheet" href="../../common/layui/css/layui.css" />
    <link rel="stylesheet" href="../../css/index.css">
    <script src="../../common/layui/layui.js"></script>
    <script src="../../common/components/ShowMessage.js" defer></script>
    <script src="../../common/components/Loading.js" defer></script>
    <style>
        .alpineData {
            font-size: 14px;
            color: #333;
            display: flex;
            padding: 8px;
        }

        .leftAlpineBox {
            flex: 3;
            padding: 20px;
            border-radius: 6px;
        }

        .centerAlpineBox {
            padding: 20px;
            flex: 3;
            margin: 0 12px;
            border-radius: 6px;
        }

        .centerAlpineBox .layui-form-checkbox {
            margin-bottom: 4px;
        }

        .rightAlpineBox {
            padding: 20px;
            flex: 3;
            border-radius: 6px;
        }

        .data_textarea {
            resize: both;
            border: 1px solid #c2c2c2;
            border-radius: 4px;
        }

        .data_textarea::placeholder {
            color: #ccc;
        }

        .layui-btn {
            height: 36px;
            line-height: 36px;
            padding: 0 16px;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            transform: perspective(800px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .layui-btn-sm {
            margin: 6px 0;
            font-weight: 700;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff7847 0%, #ffb67a 100%);
            border: none;
            box-shadow: 0 4px 15px rgba(255, 120, 24, 0.3);
        }

        .laybox {
            display: flex;
            flex-direction: column;
        }

        /* checkbox */
        .layui-form-checked[lay-skin=primary]>i{
            border-color: #ff7847 !important;
            background-color: #ff7847 !important;
            color: #fff;
        }
        .layui-form-checkbox[lay-skin=primary]:hover>i{
            border-color: #ff7847 !important;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="alpineData">
        <div class="leftAlpineBox layui-panel">
            <div class="tweHtml">
                <h4 style="color: #ff7847;">原始html：</h4>
                <hr>
                <textarea id="dataInput" class="data_textarea layui-textarea" placeholder="第一步请先将原始HTML代码粘贴到这里"></textarea>
                <div>
                    <iframe id="myIframe" src="" frameborder="0"
                        style="width: 100%;border: 1px solid #d8d8d8;margin-top: 10px;"></iframe>
                    <div style="margin-top: 12px; padding: 10px; border-left: 3px solid #ff7847; background: #f8f9fa;">
                        <div style="margin-bottom: 8px;">
                            <i class="layui-icon layui-icon-tips" style="color: #ff7847;"></i>
                            <span style="color: #ff7847; font-weight: 500;">使用方法：</span>
                            <span style="font-size: 13px;">左边框框粘贴HTML → 勾选需要的QA复选框 → 点击 ➊ ➋ 按钮 → 复制结果 → 粘贴回原始文件</span>
                        </div>
                        <div style="margin-bottom: 8px;">
                            <i class="layui-icon layui-icon-notice" style="color: #ff7847;"></i>
                            <span style="color: #ff7847; font-weight: 500;">注意：</span>
                            <span style="font-size: 13px;">建议QA前备份一个原始html文件，添加QA代码后在浏览器中对比，确保两个页面一样</span>
                        </div>
                        <div>
                            <i class="layui-icon layui-icon-notice" style="color: #ff4d50;"></i>
                            <span style="color: #ff4d50; font-weight: 500;">提醒：</span>
                            <span style="font-size: 13px;">每次使用后请刷新页面，再进行下一次操作</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="centerAlpineBox layui-panel">
            <div class="layui-form laybox">
                <input type="checkbox" id="allSelectCheckbox" name="allSelect" title="全选" checked
                    lay-filter="checkbox-allSelect">
                <hr>
                <input type="checkbox" id="addMarginCheckbox" name="addMargin" title="h标签p标签加margin" checked>
                <input type="checkbox" id="delUnderlineCheckbox" name="delUnderline" title="a标签去掉下划线" checked>
                <input type="checkbox" id="hideSmallImgCheckbox" name="hideSmallImg" title="img最近的hideSmall父元素添加display:none;" checked>
                <input type="checkbox" id="supNormalSizeCheckbox" name="supNormalSize" title="sup标签设置行内样式（sina/163邮箱）" checked>
                    
                <hr>
            </div>
            <div class="layui-btn-container">
                <button id="submitButton"
                    class="layui-btn layui-btn-sm  layui-bg-orange layui-icon layui-icon-component"> 一键添加QA ➊</button>
                <button id="outputButton"
                    class="layui-btn layui-btn-sm  layui-bg-orange layui-icon layui-icon-fonts-code"> 生成Code ➋</button>
            </div>
        </div>
        <div class="rightAlpineBox layui-panel">
            <h4 style="color: #ff7847;">QA后html：</h4>
            <hr>
            <textarea id="dataOutput" class="data_textarea layui-textarea" placeholder="生成后这里会出现QA完成后的html代码"></textarea>
            <hr>
            <div class="layui-btn-container">
                <button id="copyButton"
                    class="layui-btn layui-btn-sm  layui-bg-orange layui-icon layui-icon-file-b"> 复制代码 ➌</button>
                <button id="resetButton"
                    class="layui-btn layui-btn-sm  layui-bg-orange layui-icon layui-icon-refresh"> 刷新页面 ➍</button>
            </div>
        </div>
    </div>
    <script>
        
    

        document.addEventListener('DOMContentLoaded', function () {
            const dataInput = document.getElementById('dataInput');
            const dataOutput = document.getElementById('dataOutput');
            const iframe = document.getElementById('myIframe');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

            // Checkbox element
            const allSelectCheckbox = document.getElementById('allSelectCheckbox');
            const addMarginCheckbox = document.getElementById('addMarginCheckbox');
            const delUnderlineCheckbox = document.getElementById('delUnderlineCheckbox');
            const hideSmallImgCheckbox = document.getElementById('hideSmallImgCheckbox');
            const supNormalSizeCheckbox = document.getElementById('supNormalSizeCheckbox');
            // Checkbox element

            const submitButton = document.getElementById('submitButton');
            const outputButton = document.getElementById('outputButton');
            const copyButton = document.getElementById('copyButton');
            const resetButton = document.getElementById('resetButton');

            let html_doc = '';
            let hiddenPreContent = [];
            let hiddenFontContent = '';
            let dynamicContent = '';
            function hiddenPreDivRe() {
                return /<div style="display: none; max-height: 0px; overflow: hidden;">([\s\S]*?)<\/div>/g;
            }
            const whitespaceEntityTokens = {
                '&nbsp;': '[[[QA_ENTITY_NBSP]]]',
                '&ensp;': '[[[QA_ENTITY_ENSP]]]',
                '&emsp;': '[[[QA_ENTITY_EMSP]]]',
                '&thinsp;': '[[[QA_ENTITY_THINSP]]]',
            };



            // layui的一些方法
            layui.use(function () {
                let form = layui.form;
                let layer = layui.layer;
                let util = layui.util;
                // 全选
                form.on('checkbox(checkbox-allSelect)', function (data) {
                    const elem = data.elem; // 获得 checkbox 原始 DOM 对象
                    const checked = elem.checked; // 获得 checkbox 选中状态
                    const value = elem.value; // 获得 checkbox 值
                    addMarginCheckbox.checked = elem.checked
                    delUnderlineCheckbox.checked = elem.checked
                    hideSmallImgCheckbox.checked = elem.checked
                    supNormalSizeCheckbox.checked = elem.checked
                });
            })

            // input事件
            dataInput.addEventListener('input', function () {
                html_doc = dataInput.value;
                handleOutput()
            });


            // 一键添加事件
            submitButton.onclick = async () => {
                // localStorage.setItem('cy_outputButton_current_html', '')
                LoadingModule.show()
                hiddenPreContent = [];
                html_doc = dataInput.value.replace(hiddenPreDivRe(), (match) => {
                    hiddenPreContent.push(match);
                    return `<!-- [[PRE_PLACEHOLDER_${hiddenPreContent.length - 1}]] -->`;
                });
                html_doc = preserveWhitespaceEntities(html_doc);
                // 禁用输入框
                dataInput.disabled = true;
                dataInput.style.backgroundColor = '#f5f5f5';
                dataInput.style.cursor = 'not-allowed';
                // 禁用一键添加QA按钮
                submitButton.disabled = true;
                submitButton.style.setProperty('background', '#ccc', 'important');;
                submitButton.style.cursor = 'not-allowed';
                handleOutput()
                const html_doc_promise = await new Promise((resolve) => {
                    setTimeout(() => {
                        //使用三元运算符链式调用
                        addMarginCheckbox.checked && addMargin();
                        delUnderlineCheckbox.checked && delUnderline();
                        hideSmallImgCheckbox.checked && hideSmallImg();
                        supNormalSizeCheckbox.checked && supNormalSize();
                        showMessage({ msg: 'QA添加完成！', type: 'success' })
                        LoadingModule.hide()
                        resolve(html_doc)
                    }, 0)
                })
                html_doc = html_doc_promise
            }
            // 生成code按钮点击事件
            outputButton.onclick = () => {
                // 禁用生成Code按钮
                outputButton.disabled = true;
                outputButton.style.setProperty('background', '#ccc', 'important');
                outputButton.style.cursor = 'not-allowed';
                
                // 去除占位符
                let iframeOutHtml = iframeDoc.documentElement.outerHTML
                iframeOutHtml = restoreWhitespaceEntities(iframeOutHtml)
                // 将零宽连字符转换回 &zwj; 实体
                iframeOutHtml = iframeOutHtml.replace(/\u200D/g, '&zwj;')
                hiddenPreContent.forEach((block, i) => {
                    iframeOutHtml = iframeOutHtml.replace(`<!-- [[PRE_PLACEHOLDER_${i}]] -->`, () => block);
                });
                const originalPreDivs = dataInput.value.match(hiddenPreDivRe()) || [];
                let originalPreIdx = 0;
                iframeOutHtml = iframeOutHtml.replace(hiddenPreDivRe(), () => originalPreDivs[originalPreIdx++] ?? '');
                dataOutput.value = dynamicContent + '<!DOCTYPE html>' + iframeOutHtml;
                console.log("🚀 ~ 输出的 ~ iframeDoc:", iframeDoc.documentElement);

                // 存储到会话存储
                const compareObj = {
                    oldHtml: dataInput.value,
                    newHtml: dataOutput.value
                }
                localStorage.setItem('cy_outputButton_current_html', JSON.stringify(compareObj))
                showMessage({ msg: '已生成！', type: 'success' })
            }
            copyButton.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(dataOutput.value);
                    showMessage({ msg: '复制成功！', type: 'success' })
                } catch (err) {
                    console.error(err);
                }
            }
            resetButton.onclick = () => {

                
                // 清空所有变量
                hiddenPreContent = [];
                hiddenFontContent = '';
                html_doc = '';
                
                // 清空输入输出框
                dataInput.value = '';
                dataOutput.value = '';
                
                // 启用输入框
                dataInput.disabled = false;
                dataInput.style.backgroundColor = '';
                dataInput.style.cursor = '';
                
                // 重置所有复选框
                const checkboxes = document.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(checkbox => {
                    checkbox.checked = true;
                });
                
                // 刷新iframe
                handleOutput();
                
                // 刷新页面
                window.location.reload();
                window.history.go(0);
            }

            // function
            function handleOutput() {
                iframeDoc.open();
                iframeDoc.write(html_doc);
                iframeDoc.close();
            }
            function preserveWhitespaceEntities(html) {
                return Object.entries(whitespaceEntityTokens).reduce((result, [entity, token]) => {
                    return result.replace(new RegExp(escapeRegExp(entity), 'g'), token);
                }, html);
            }
            function restoreWhitespaceEntities(html) {
                return Object.entries(whitespaceEntityTokens).reduce((result, [entity, token]) => {
                    return result.replace(new RegExp(escapeRegExp(token), 'g'), entity);
                }, html);
            }
            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
            // 给h1~h6,p标签加上margin：0；
            function addMargin() {
                const elements = iframeDoc.querySelectorAll('h1, h2, h3, h4, h5, h6, p');
                console.log("🚀 ~ addMargin ~ elements:", elements)
                elements.forEach(dom => {
                    if (!dom.style.margin && !dom.style.marginTop && !dom.style.marginRight && !dom.style.marginBottom && !dom.style.marginLeft) {
                        console.log('加 margin');
                        dom.style.margin = '0';
                    }
                });
            }
            // 删除a标签下划线
            function delUnderline() {
                const elements = iframeDoc.querySelectorAll('a');
                console.log("🚀 ~ delUnderline ~ elements:", elements)
                elements.forEach(a => {
                    if (!a.style.textDecoration) {
                        const computedTextDecoration = window.getComputedStyle(a).textDecorationLine
                        console.log('a标签计算样式', computedTextDecoration, 'a标签行内样式', a.style.textDecoration);
                        a.style.textDecoration = computedTextDecoration;
                    }
                });
            }
            // img最近的hideSmall父元素添加display:none;
            function hideSmallImg() {
                const elements = iframeDoc.querySelectorAll('img');
                console.log("🚀 ~ hideSmallImg ~ elements:", elements)
                elements.forEach(img => {
                    const hideSmallParent = img.parentElement && img.parentElement.closest('.hideSmall');
                    if (hideSmallParent) {
                        hideSmallParent.style.display = 'none';
                    }
                });
            }

            // mobile的sup标签设置行内样式（sina/163邮箱）
            function supNormalSize() {
                const sups = iframeDoc.querySelectorAll('sup');
                sups.forEach(o => {
                    o.style.fontSize = '0.65em'
                    o.style.lineHeight = '0'
                    o.style.verticalAlign = 'super'
                })
            }


        });
    </script>
</body>

</html>
