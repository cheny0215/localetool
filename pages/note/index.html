<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>便签</title>
    <script src="../../common/components/ShowMessage.js"></script>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --line: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --soft: #f9fafb;
            --ink: #111827;
            --ok: #047857;
            --general: #4f46e5;
            --general-soft: #eef2ff;
            --qa: #ea580c;
            --qa-soft: #fff7ed;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        button, input { font-family: inherit; }

        body.tone-general { background: linear-gradient(180deg, #e0e7ff 0%, var(--bg) 280px); }
        body.tone-qa { background: linear-gradient(180deg, #ffedd5 0%, #fff7ed 180px, var(--bg) 320px); }

        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
            max-width: 980px;
            margin: 0 auto;
        }

        header {
            flex: none;
            padding: 18px 20px 12px;
        }

        .title-row h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -0.03em;
        }

        .title-row p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .tab {
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.7);
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
        }

        .tab[data-tab="general"].active {
            color: #3730a3;
            background: #e0e7ff;
            border-color: #a5b4fc;
        }

        .tab[data-tab="qa-emails"].active {
            color: #c2410c;
            background: #ffedd5;
            border-color: #fdba74;
        }

        .search {
            width: 100%;
            margin-top: 12px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            background: #fff;
        }

        .app.general .search:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .app.qa .search:focus {
            border-color: #fdba74;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
        }

        .search:focus { outline: none; }

        .filter-bar {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 12px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }

        .quick-row, .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--text);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .set-name, .chip-mini {
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .chip-mini { font-size: 14px; line-height: 1; opacity: 0.75; padding: 0 2px; }
        .chip-mini:hover { opacity: 1; }

        .more { position: relative; display: inline-flex; }
        .group .more, .note .more { opacity: 0; pointer-events: none; }
        .group:hover .more, .note:hover .more, .more:focus-within { opacity: 1; pointer-events: auto; }

        .menu {
            position: fixed;
            z-index: 30;
            display: flex;
            flex-direction: column;
            min-width: 96px;
            padding: 4px;
            background: #fff;
            color: #111827;
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(17, 24, 39, 0.14);
        }

        .menu[hidden] { display: none; }

        .menu button {
            border: 0;
            background: transparent;
            color: #111827;
            text-align: left;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .menu button:hover { background: #f3f4f6; }
        .menu button.danger { color: #b91c1c; }

        .set-name[contenteditable="true"] {
            outline: none;
            background: rgba(17, 24, 39, 0.08);
            color: inherit;
            border-radius: 4px;
            padding: 0 4px;
            cursor: text;
            box-shadow: inset 0 0 0 1px currentColor;
        }

        .chip.on .set-name[contenteditable="true"] {
            background: rgba(0, 0, 0, 0.28);
            color: #fff;
        }

        .move-set {
            margin-left: auto;
            border: 1px solid var(--tone-line, #e5e7eb);
            background: var(--tone-soft, #f3f4f6);
            color: #111827;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            max-width: 160px;
        }

        .inbox {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 4px 0 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px dashed var(--tone-line, #c7d2fe);
        }

        .inbox span { font-size: 12px; color: var(--muted); font-weight: 600; }

        .inbox button {
            border: 1px solid #c7d2fe;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .chip.on { color: #fff; }

        .chip[data-tone="0"] { color: #1d4ed8; border-color: #93c5fd; background: #eff6ff; }
        .chip[data-tone="1"] { color: #7c3aed; border-color: #c4b5fd; background: #f5f3ff; }
        .chip[data-tone="2"] { color: #0f766e; border-color: #5eead4; background: #f0fdfa; }
        .chip[data-tone="3"] { color: #b45309; border-color: #fcd34d; background: #fffbeb; }
        .chip[data-tone="4"] { color: #be123c; border-color: #fda4af; background: #fff1f2; }
        .chip[data-tone="5"] { color: #047857; border-color: #6ee7b7; background: #ecfdf5; }
        .chip[data-tone].on,
        .chip[data-tone].on .set-name,
        .chip[data-tone].on .chip-mini {
            color: #fff;
        }

        .chip[data-tone="0"].on { background: #2563eb; border-color: #2563eb; }
        .chip[data-tone="1"].on { background: #7c3aed; border-color: #7c3aed; }
        .chip[data-tone="2"].on { background: #0f766e; border-color: #0f766e; }
        .chip[data-tone="3"].on { background: #d97706; border-color: #d97706; }
        .chip[data-tone="4"].on { background: #e11d48; border-color: #e11d48; }
        .chip[data-tone="5"].on { background: #059669; border-color: #059669; }

        .chip[data-platform="qq"] { color: #0877a8; border-color: #7dd3fc; background: #fff; }
        .chip[data-platform="163"] { color: #b91c1c; border-color: #fca5a5; background: #fff; }
        .chip[data-platform="sina"] { color: #c2410c; border-color: #fdba74; background: #fff; }
        .chip[data-platform="outlook"] { color: #1d4ed8; border-color: #93c5fd; background: #fff; }
        .chip[data-platform="gmail"] { color: #b91c1c; border-color: #fca5a5; background: #fff; }
        .chip[data-platform="yahoo"] { color: #6d28d9; border-color: #c4b5fd; background: #fff; }
        .chip[data-platform="apple"] { color: #374151; border-color: #d1d5db; background: #fff; }
        .chip[data-platform="qq"].on { background: #0369a1; border-color: #0369a1; color: #fff; box-shadow: 0 0 0 3px #bae6fd; }
        .chip[data-platform="163"].on { background: #b91c1c; border-color: #b91c1c; color: #fff; box-shadow: 0 0 0 3px #fecaca; }
        .chip[data-platform="sina"].on { background: #c2410c; border-color: #c2410c; color: #fff; box-shadow: 0 0 0 3px #fed7aa; }
        .chip[data-platform="outlook"].on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; box-shadow: 0 0 0 3px #bfdbfe; }
        .chip[data-platform="gmail"].on { background: #b91c1c; border-color: #b91c1c; color: #fff; box-shadow: 0 0 0 3px #fecaca; }
        .chip[data-platform="yahoo"].on { background: #6d28d9; border-color: #6d28d9; color: #fff; box-shadow: 0 0 0 3px #ddd6fe; }
        .chip[data-platform="apple"].on { background: #111827; border-color: #111827; color: #fff; box-shadow: 0 0 0 3px #e5e7eb; }

        .chip.preset {
            font-size: 12px;
            color: #9a3412;
            border-color: #fdba74;
            background: #fff;
        }

        .chip.preset.on {
            background: var(--qa);
            border-color: var(--qa);
            color: #fff;
            box-shadow: 0 0 0 3px #fed7aa;
        }

        .app.qa .chip[data-platform],
        .app.qa .chip.preset { gap: 6px; }
        .app.qa .chip[data-platform]::before,
        .app.qa .chip.preset::before {
            content: "";
            width: 14px;
            height: 14px;
            border-radius: 4px;
            border: 1.5px solid currentColor;
            background: transparent;
            flex: none;
            box-sizing: border-box;
        }
        .app.qa .chip[data-platform].on::before,
        .app.qa .chip.preset.on::before {
            content: "✓";
            display: grid;
            place-items: center;
            border-color: #fff;
            color: #fff;
            font-size: 11px;
            line-height: 1;
            font-weight: 700;
        }
        .app.qa .chip.all:not(.on) {
            background: #fff;
            color: #9a3412;
            border-color: #fdba74;
        }
        .app.qa .chip.all.on { box-shadow: 0 0 0 3px #fed7aa; }
        .chip.all.on { background: var(--ink); border-color: var(--ink); color: #fff; }
        .app.general .chip.all.on { background: var(--general); border-color: var(--general); }
        .app.qa .chip.all.on { background: var(--qa); border-color: var(--qa); }

        .chip.add {
            border-style: dashed;
            color: var(--general);
            background: #fff;
        }

        .copy-selected {
            flex: none;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: var(--general);
            color: #fff;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .app.qa .copy-selected { background: var(--qa); }

        .copy-selected:disabled {
            background: #d1d5db;
            cursor: default;
        }

        main {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 4px 20px 28px;
        }

        .group {
            background: var(--card);
            border: 1px solid var(--tone-line, var(--line));
            border-radius: 14px;
            margin-bottom: 12px;
            overflow: hidden;
            border-top: 3px solid var(--tone, #6366f1);
        }

        .group[data-tone="0"] { --tone: #2563eb; --tone-soft: #eff6ff; --tone-line: #bfdbfe; }
        .group[data-tone="1"] { --tone: #7c3aed; --tone-soft: #f5f3ff; --tone-line: #ddd6fe; }
        .group[data-tone="2"] { --tone: #0f766e; --tone-soft: #f0fdfa; --tone-line: #99f6e4; }
        .group[data-tone="3"] { --tone: #d97706; --tone-soft: #fffbeb; --tone-line: #fde68a; }
        .group[data-tone="4"] { --tone: #e11d48; --tone-soft: #fff1f2; --tone-line: #fecdd3; }
        .group[data-tone="5"] { --tone: #059669; --tone-soft: #ecfdf5; --tone-line: #a7f3d0; }
        .group.picked { box-shadow: 0 0 0 2px var(--tone, #4f46e5); }

        .group.dragging { opacity: 0.45; }
        .group.drag-above { box-shadow: inset 0 2px 0 var(--ink); }
        .group.drag-below { box-shadow: inset 0 -2px 0 var(--ink); }

        .group-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 12px 8px;
        }

        .grip {
            width: 22px;
            height: 22px;
            border: 0;
            background: transparent;
            color: #9ca3af;
            cursor: grab;
            font-size: 14px;
            letter-spacing: -1px;
            padding: 0;
        }

        .group-title {
            flex: 1;
            margin: 0;
            font-size: 15px;
            min-width: 0;
        }

        .group-title { color: var(--tone, var(--text)); }
        .group-title[contenteditable="true"] {
            outline: none;
            background: var(--tone-soft, #eef2ff);
            color: #111827;
            box-shadow: inset 0 0 0 1px var(--tone, #a5b4fc);
            border-radius: 6px;
            padding: 2px 6px;
        }

        .group-actions, .note-actions, .qa-actions {
            display: flex;
            gap: 2px;
            opacity: 0;
        }

        .group:hover .group-actions,
        .note:hover .note-actions,
        .qa-card:hover .qa-actions,
        .note.is-editing .note-actions,
        .group.is-editing .group-actions,
        .qa-card.is-editing .qa-actions {
            opacity: 1;
        }

        .text-btn, .add-btn, .more-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .text-btn:hover, .add-btn:hover, .more-btn:hover { background: var(--soft); color: var(--text); }
        .text-btn.danger:hover { color: #b91c1c; }

        .note {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 0 8px 8px;
            padding: 10px 10px;
            border-radius: 10px;
            cursor: pointer;
            background: var(--tone-soft, var(--soft));
        }

        .note:hover { filter: saturate(1.05) brightness(0.98); }

        .note.copied {
            background: #ecfdf5;
        }

        .note-body {
            flex: 1;
            min-width: 0;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note.is-open .note-body,
        .note.is-editing .note-body {
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .note.is-editing { cursor: text; background: var(--tone-soft, #f3f4f6); color: #111827; outline: 1px solid var(--tone, #d1d5db); }
        .note.is-editing .note-body { color: #111827; }

        .note-side {
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .copy-hint {
            font-size: 12px;
            font-weight: 600;
            color: var(--tone, #9ca3af);
        }

        .note.copied .copy-hint { color: var(--ok); }
        .note.is-editing .copy-hint { display: none; }

        .add-row, .add-group {
            display: flex;
        }

        .add-row { padding: 0 8px 10px; }
        .add-group { margin-top: 4px; }

        .add-group .add-btn {
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            background: transparent;
            font-size: 13px;
        }

        .qa-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .qa-card {
            background: #fff;
            border: 1px solid var(--tone-line, var(--line));
            border-top: 3px solid var(--tone, #ea580c);
            border-radius: 14px;
            padding: 12px 14px 10px;
            cursor: pointer;
            min-height: 120px;
            display: flex;
            flex-direction: column;
        }

        .qa-card[data-platform="qq"] { --tone: #0ea5e9; --tone-line: #bae6fd; }
        .qa-card[data-platform="163"] { --tone: #dc2626; --tone-line: #fecaca; }
        .qa-card[data-platform="sina"] { --tone: #ea580c; --tone-line: #fed7aa; }
        .qa-card[data-platform="outlook"] { --tone: #2563eb; --tone-line: #bfdbfe; }
        .qa-card[data-platform="gmail"] { --tone: #dc2626; --tone-line: #fecaca; }
        .qa-card[data-platform="yahoo"] { --tone: #7c3aed; --tone-line: #ddd6fe; }
        .qa-card[data-platform="apple"] { --tone: #111827; --tone-line: #e5e7eb; }
        .qa-card.picked { box-shadow: 0 0 0 2px var(--tone, #ea580c); }
        .qa-head h3 { color: var(--tone, var(--text)); }
        .qa-card.copied { background: #ecfdf5; }
        .qa-card.is-editing { cursor: text; }

        .qa-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qa-head h3 {
            margin: 0;
            font-size: 15px;
        }

        .qa-count {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .qa-actions { margin-left: auto; }

        .qa-body {
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.55;
            color: #374151;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .qa-card.is-editing .qa-body {
            outline: none;
            background: var(--soft);
            border-radius: 8px;
            padding: 8px;
        }

        .qa-foot {
            margin-top: auto;
            padding-top: 8px;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 600;
        }

        .qa-card.copied .qa-foot { color: var(--ok); }
        .qa-card.is-editing .qa-foot { display: none; }

        .is-hidden { display: none !important; }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 16px;
            font-size: 14px;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }
    </style>
</head>

<body>
    <div class="app" id="app">
        <header>
            <div class="title-row">
                <h1>便签</h1>
                <p>上面是组。把账号、邮箱这类模块放进组1、组2。点模块内容即可复制。</p>
            </div>
            <div class="tabs">
                <button class="tab active" type="button" data-tab="general">常用</button>
                <button class="tab" type="button" data-tab="qa-emails">QA 邮箱</button>
            </div>
            <input class="search" id="search" type="search" placeholder="搜索要复制的内容" autocomplete="off">
            <div class="filter-bar">
                <div class="chips" id="chips"></div>
                <button class="copy-selected" id="copySelected" type="button" disabled>复制所选</button>
            </div>
        </header>
        <main id="board"></main>
    </div>

        const searchInput = document.getElementById('search');
        const copySelectedBtn = document.getElementById('copySelected');
        const originals = new WeakMap();

        let state = { activeTab: 'general', groups: [], sets: [], qa: {} };
        let picked = new Set();
        let pickedSets = new Set();
        let dragIndex = null;
        let focusAfterRender = null;

        function readRaw() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            } catch (error) {
                return null;
            }
        }

        function load() {
            const raw = readRaw();
            if (!raw) {
                const setId = 'set_1';
                state.sets = [{ id: setId, name: '组1' }];
                state.groups = DEFAULT_GROUPS.map(group => ({ title: group.title, notes: group.notes.slice(), setId }));
                state.qa = { ...DEFAULT_QA };
                state.activeTab = 'general';
                pickedSets = new Set([setId]);
                persist();
                return;
            }

            state.activeTab = raw.activeTab === 'qa-emails' ? 'qa-emails' : 'general';

            if (Array.isArray(raw.fields) && raw.fields.length) {
                state.groups = raw.fields.map(field => ({
                    title: (raw.legends && raw.legends[field.title]) || '未命名模块',
                    notes: (field.notes || []).map(key => (raw.notes && raw.notes[key]) || ''),
                    setId: field.setId || ''
                }));
            } else {
                state.groups = DEFAULT_GROUPS.map(group => ({ title: group.title, notes: group.notes.slice(), setId: '' }));
                const oldNotes = raw.notes || {};
                const counts = [2, 1, 1];
                let cursor = 0;
                state.groups.forEach((group, index) => {
                    if (raw.legends && raw.legends['legend_' + index]) {
                        group.title = raw.legends['legend_' + index];
                    }
                    for (let i = 0; i < counts[index]; i++) {
                        const saved = oldNotes['note_' + cursor];
                        if (saved) group.notes[i] = saved;
                        cursor++;
                    }
                });
            }

            let migratedSets = false;
            if (Array.isArray(raw.sets) && raw.sets.length) {
                state.sets = raw.sets.map(set => ({ id: set.id, name: set.name || '未命名组' }));
            } else {
                const setId = 'set_1';
                state.sets = [{ id: setId, name: '组1' }];
                state.groups.forEach(group => {
                    if (!group.setId) group.setId = setId;
                });
                migratedSets = true;
            }
            pickedSets = new Set(state.sets.map(set => set.id));

            state.qa = {};
            PLATFORMS.forEach((platform, index) => {
                const saved = raw.notes && (raw.notes['email_section_' + platform.id] || raw.notes['note_' + (4 + index)]);
                state.qa[platform.id] = saved || DEFAULT_QA[platform.id];
            });
            if (migratedSets) persist();
        }

        function persist() {
            const data = { notes: {}, legends: {}, fields: [], sets: state.sets, activeTab: state.activeTab };
            state.groups.forEach((group, fieldIndex) => {
                const legendKey = 'legend_' + fieldIndex;
                data.legends[legendKey] = group.title;
                const noteKeys = group.notes.map((html, noteIndex) => {
                    const noteKey = `note_${fieldIndex}_${noteIndex}`;
                    data.notes[noteKey] = html;
                    return noteKey;
                });
                data.fields.push({ title: legendKey, notes: noteKeys, setId: group.setId || '' });
            });
            PLATFORMS.forEach(platform => {
                data.notes['email_section_' + platform.id] = state.qa[platform.id] || '';
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        function plainFrom(el) {
            const parts = [];
            const walk = node => {
                node.childNodes.forEach(child => {
                    if (child.nodeType === 3) {
                        parts.push(child.textContent);
                    } else if (child.nodeName === 'BR') {
                        parts.push('\n');
                    } else if (child.nodeType === 1) {
                        const block = /^(DIV|P|LI|H[1-6]|TR)$/.test(child.nodeName);
                        if (block && parts.length && !parts[parts.length - 1].endsWith('\n')) parts.push('\n');
                        walk(child);
                        if (block && parts.length && !parts[parts.length - 1].endsWith('\n')) parts.push('\n');
                    }
                });
            };
            walk(el);
            return parts.join('').replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        }

        function copyPayload(el) {
            const lines = plainFrom(el).split('\n').map(line => line.trim()).filter(Boolean);
            if (lines.length > 1 && lines.every(line => line.includes('@'))) {
                return lines.map(line => line.replace(/[,，]\s*$/, '')).join(',');
            }
            return lines.join('\n');
        }

        function emailsFrom(el) {
            return plainFrom(el).split('\n').map(line => line.trim().replace(/[,，]\s*$/, '')).filter(Boolean);
        }

        function writeClipboard(text) {
            const area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.left = '-9999px';
            document.body.appendChild(area);
            area.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (error) { ok = false; }
            document.body.removeChild(area);
            if (ok) return Promise.resolve();
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            return Promise.reject(new Error('copy failed'));
        }

        function flash(el, hint) {
            el.classList.add('copied');
            if (hint) hint.textContent = '已复制';
            setTimeout(() => {
                el.classList.remove('copied');
                if (hint) hint.textContent = el.classList.contains('qa-card') ? hint.dataset.label : '复制';
            }, 1200);
        }

        function renderChips() {
            const box = document.getElementById('chips');
            if (state.activeTab === 'qa-emails') {
                const allOn = PLATFORMS.every(platform => picked.has(platform.id));
                const presets = PRESETS.map(preset => {
                    const on = preset.platforms.length === picked.size && preset.platforms.every(id => picked.has(id));
                    return `<button class="chip preset ${on ? 'on' : ''}" type="button" data-preset="${preset.id}">${preset.label}</button>`;
                }).join('');
                const platforms = PLATFORMS.map(platform =>
                    `<button class="chip ${picked.has(platform.id) ? 'on' : ''}" type="button" data-platform="${platform.id}">${platform.label}</button>`
                ).join('') + `<button class="chip all ${allOn ? 'on' : ''}" type="button" data-platform="all">全选</button>`;
                box.innerHTML = `<div class="quick-row">${presets}</div><div class="chip-row">${platforms}</div>`;
                copySelectedBtn.disabled = picked.size === 0;
                copySelectedBtn.textContent = picked.size ? `复制 ${picked.size} 个平台` : '复制所选';
                return;
            }

            const allOn = state.sets.length > 0 && state.sets.every(set => pickedSets.has(set.id));
            box.innerHTML = state.sets.map((set, index) => `
                <span class="chip ${pickedSets.has(set.id) ? 'on' : ''}" data-set="${esc(set.id)}" data-tone="${index % 6}">
                    <span class="set-name">${esc(set.name)}</span>
                    <span class="more">
                        <button class="chip-mini" type="button" data-action="menu" aria-label="更多">···</button>
                        <span class="menu" hidden>
                            <button type="button" data-action="rename-set" data-set="${esc(set.id)}">改名</button>
                            <button class="danger" type="button" data-action="delete-set" data-set="${esc(set.id)}">删除</button>
                        </span>
                    </span>
                </span>
            `).join('') + `<button class="chip all ${allOn ? 'on' : ''}" type="button" data-set="all">全选</button>`
                + `<button class="chip add" type="button" data-action="add-set">+ 组</button>`;
            copySelectedBtn.disabled = pickedSets.size === 0;
            copySelectedBtn.textContent = pickedSets.size ? `复制 ${pickedSets.size} 个组` : '复制所选';
        }

        function render() {
            const qa = state.activeTab === 'qa-emails';
            app.classList.toggle('qa', qa);
            app.classList.toggle('general', !qa);
            document.body.classList.toggle('tone-qa', qa);
            document.body.classList.toggle('tone-general', !qa);
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === state.activeTab);
            });
            renderChips();
            board.innerHTML = '';
            if (state.activeTab === 'general') board.appendChild(renderGeneral());
            else board.appendChild(renderQA());
            markOverflow();
            applySearch();
            board.scrollTop = 0;
            if (focusAfterRender) {
                const target = board.querySelector(focusAfterRender);
                if (target) beginEdit(target);
                focusAfterRender = null;
            }
        }

        function groupVisible(group) {
            if (pickedSets.size === 0) return true;
            if (!group.setId) return pickedSets.size === state.sets.length;
            return pickedSets.has(group.setId);
        }

        function renderGeneral() {
            const wrap = document.createElement('div');
            const singleSet = pickedSets.size === 1 ? state.sets.find(set => pickedSets.has(set.id)) : null;
            state.groups.forEach((group, gi) => {
                if (!groupVisible(group)) return;
                const section = document.createElement('section');
                section.className = 'group';
                section.dataset.gi = String(gi);
                section.dataset.tone = String(gi % 6);
                const options = state.sets.map(set =>
                    `<option value="${esc(set.id)}" ${group.setId === set.id ? 'selected' : ''}>${esc(set.name)}</option>`
                ).join('');

                const head = document.createElement('div');
                head.className = 'group-head';
                head.innerHTML = `
                    <button class="grip" type="button" draggable="true" title="拖动排序" aria-label="拖动排序">⋮⋮</button>
                    <h2 class="group-title">${esc(group.title)}</h2>
                    <select class="move-set" data-action="move-set" aria-label="放入哪个组">
                        <option value="" ${group.setId ? '' : 'selected'}>未放入组</option>
                        ${options}
                    </select>
                    <span class="more">
                        <button class="text-btn" type="button" data-action="menu" aria-label="更多">···</button>
                        <span class="menu" hidden>
                            <button type="button" data-action="rename">改名</button>
                            <button class="danger" type="button" data-action="delete-group">删除</button>
                        </span>
                    </span>`;
                section.appendChild(head);

                group.notes.forEach((html, ni) => {
                    const note = document.createElement('div');
                    note.className = 'note';
                    note.dataset.gi = String(gi);
                    note.dataset.ni = String(ni);
                    const body = document.createElement('div');
                    body.className = 'note-body';
                    body.innerHTML = html;
                    const side = document.createElement('div');
                    side.className = 'note-side';
                    side.innerHTML = `
                        <span class="copy-hint">复制</span>
                        <span class="more">
                            <button class="text-btn" type="button" data-action="menu" aria-label="更多">···</button>
                            <span class="menu" hidden>
                                <button type="button" data-action="edit">编辑</button>
                                <button class="danger" type="button" data-action="delete-note">删除</button>
                            </span>
                        </span>
                        <button class="more-btn is-hidden" type="button" data-action="expand">展开</button>`;
                    note.append(body, side);
                    section.appendChild(note);
                });

                const add = document.createElement('div');
                add.className = 'add-row';
                add.innerHTML = `<button class="add-btn" type="button" data-action="add-note">+ 添加一条</button>`;
                section.appendChild(add);
                wrap.appendChild(section);
            });

            const create = document.createElement('div');
            create.className = 'add-group';
            create.innerHTML = `<button class="add-btn" type="button" data-action="add-group">+ 添加模块</button>`;
            wrap.appendChild(create);

            if (singleSet) {
                const outside = state.groups
                    .map((group, gi) => ({ group, gi }))
                    .filter(item => item.group.setId !== singleSet.id);
                if (!state.groups.some(group => group.setId === singleSet.id)) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.textContent = `${singleSet.name} 还是空的，把下面的模块放进来。`;
                    wrap.insertBefore(empty, create);
                }
                if (outside.length) {
                    const inbox = document.createElement('div');
                    inbox.className = 'inbox';
                    inbox.innerHTML = `<span>放进「${esc(singleSet.name)}」</span>` + outside.map(item =>
                        `<button type="button" data-action="assign" data-gi="${item.gi}">${esc(item.group.title)}</button>`
                    ).join('');
                    wrap.insertBefore(inbox, create);
                }
            }
            return wrap;
        }

        function renderQA() {
            const grid = document.createElement('div');
            grid.className = 'qa-grid';
            PLATFORMS.forEach(platform => {
                const card = document.createElement('article');
                card.className = 'qa-card' + (picked.has(platform.id) ? ' picked' : '');
                card.dataset.platform = platform.id;
                const emails = emailsFromHtml(state.qa[platform.id]);
                card.innerHTML = `
                    <div class="qa-head">
                        <h3>${platform.label}</h3>
                        <span class="qa-count">${emails.length} 个</span>
                        <div class="qa-actions">
                            <button class="text-btn" type="button" data-action="edit-qa">编辑</button>
                        </div>
                    </div>`;
                const body = document.createElement('div');
                body.className = 'qa-body';
                body.innerHTML = state.qa[platform.id] || '';
                const foot = document.createElement('div');
                foot.className = 'qa-foot';
                foot.dataset.label = '点击复制';
                foot.textContent = '点击复制';
                card.append(body, foot);
                grid.appendChild(card);
            });
            return grid;
        }

        function emailsFromHtml(html) {
            const holder = document.createElement('div');
            holder.innerHTML = html || '';
            return emailsFrom(holder);
        }

        function markOverflow() {
            board.querySelectorAll('.note').forEach(note => {
                const body = note.querySelector('.note-body');
                const more = note.querySelector('[data-action="expand"]');
                if (body.scrollHeight > body.clientHeight + 4) more.classList.remove('is-hidden');
            });
        }

        function applySearch() {
            const query = searchInput.value.trim().toLowerCase();
            let visible = 0;
            if (state.activeTab === 'general') {
                board.querySelectorAll('.group').forEach(group => {
                    let shown = 0;
                    const title = group.querySelector('.group-title').textContent.toLowerCase();
                    group.querySelectorAll('.note').forEach(note => {
                        const text = note.querySelector('.note-body').textContent.toLowerCase();
                        const match = !query || title.includes(query) || text.includes(query);
                        note.classList.toggle('is-hidden', !match);
                        if (match) shown++;
                    });
                    const titleMatch = !query || title.includes(query);
                    group.classList.toggle('is-hidden', !titleMatch && shown === 0);
                    if (!group.classList.contains('is-hidden')) visible++;
                });
            } else {
                board.querySelectorAll('.qa-card').forEach(card => {
                    const text = (card.querySelector('h3').textContent + ' ' + card.querySelector('.qa-body').textContent).toLowerCase();
                    const match = !query || text.includes(query);
                    card.classList.toggle('is-hidden', !match);
                    if (match) visible++;
                });
            }
            let empty = board.querySelector('.search-empty');
            if (query && visible === 0) {
                if (!empty) {
                    empty = document.createElement('div');
                    empty.className = 'empty search-empty';
                    empty.textContent = '没有匹配的内容';
                    board.appendChild(empty);
                }
            } else if (empty) {
                empty.remove();
            }
        }

        function beginEdit(body) {
            const host = body.closest('.note, .qa-card, .group');
            originals.set(body, body.classList.contains('group-title') ? body.textContent : body.innerHTML);
            body.contentEditable = 'true';
            host.classList.add('is-editing');
            if (host.classList.contains('note')) {
                const more = host.querySelector('[data-action="expand"]');
                if (more) more.classList.add('is-hidden');
            }
            body.focus();
            const range = document.createRange();
            range.selectNodeContents(body);
            range.collapse(false);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function finishEdit(body, cancel) {
            const host = body.closest('.note, .qa-card, .group');
            if (!host || !host.classList.contains('is-editing')) return;
            if (cancel && originals.has(body)) {
                if (body.classList.contains('group-title')) body.textContent = originals.get(body);
                else body.innerHTML = originals.get(body);
            }
            body.contentEditable = 'false';
            host.classList.remove('is-editing');
            originals.delete(body);

            if (body.classList.contains('group-title')) {
                const gi = Number(host.dataset.gi);
                state.groups[gi].title = body.textContent.trim() || '未命名模块';
                body.textContent = state.groups[gi].title;
            } else if (host.classList.contains('note')) {
                const gi = Number(host.dataset.gi);
                const ni = Number(host.dataset.ni);
                state.groups[gi].notes[ni] = body.innerHTML;
            } else if (host.classList.contains('qa-card')) {
                state.qa[host.dataset.platform] = body.innerHTML;
                const count = host.querySelector('.qa-count');
                count.textContent = emailsFrom(body).length + ' 个';
            }
            persist();
            if (!cancel) showMessage({ msg: '已保存', type: 'success' });
            if (host.classList.contains('note')) markOverflow();
        }

        function copyNote(note) {
            const text = copyPayload(note.querySelector('.note-body'));
            if (!text) {
                showMessage({ msg: '这条还没有内容', type: 'warning' });
                return;
            }
            writeClipboard(text).then(() => {
                flash(note, note.querySelector('.copy-hint'));
                showMessage({ msg: '已复制', type: 'success' });
            }).catch(() => showMessage({ msg: '复制失败', type: 'error' }));
        }

        function copyPlatform(id, card) {
            const body = card ? card.querySelector('.qa-body') : null;
            const list = body ? emailsFrom(body) : emailsFromHtml(state.qa[id]);
            if (!list.length) {
                showMessage({ msg: '没有邮箱', type: 'warning' });
                return;
            }
            writeClipboard(list.join(',')).then(() => {
                if (card) flash(card, card.querySelector('.qa-foot'));
                const label = PLATFORMS.find(item => item.id === id).label;
                showMessage({ msg: `已复制 ${label} 的 ${list.length} 个邮箱`, type: 'success' });
            }).catch(() => showMessage({ msg: '复制失败', type: 'error' }));
        }

        document.querySelector('.tabs').addEventListener('click', event => {
            const tab = event.target.closest('.tab');
            if (!tab || tab.dataset.tab === state.activeTab) return;
            state.activeTab = tab.dataset.tab;
            persist();
            render();
        });

        searchInput.addEventListener('input', applySearch);

        function payloadFromHtml(html) {
            const holder = document.createElement('div');
            holder.innerHTML = html || '';
            return copyPayload(holder);
        }

        function closeMenus() {
            document.querySelectorAll('.menu').forEach(menu => { menu.hidden = true; });
        }

        function toggleMenu(trigger) {
            const menu = trigger.closest('.more').querySelector('.menu');
            const willOpen = menu.hidden;
            closeMenus();
            if (!willOpen) return;
            menu.hidden = false;
            const rect = trigger.getBoundingClientRect();
            const width = menu.offsetWidth;
            const height = menu.offsetHeight;
            let top = rect.bottom + 6;
            if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 6);
            let left = rect.right - width;
            if (left < 8) left = 8;
            if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
            menu.style.top = top + 'px';
            menu.style.left = left + 'px';
        }

        document.addEventListener('click', event => {
            if (event.target.closest('[data-action="menu"]') || event.target.closest('.menu')) return;
            closeMenus();
        });
        board.addEventListener('scroll', closeMenus);

        document.getElementById('chips').addEventListener('click', event => {
            const menuBtn = event.target.closest('[data-action="menu"]');
            if (menuBtn) {
                toggleMenu(menuBtn);
                return;
            }
            const rename = event.target.closest('[data-action="rename-set"]');
            if (rename) {
                closeMenus();
                const name = rename.closest('.chip').querySelector('.set-name');
                name.contentEditable = 'true';
                name.focus();
                const range = document.createRange();
                range.selectNodeContents(name);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                return;
            }
            const remove = event.target.closest('[data-action="delete-set"]');
            if (remove) {
                closeMenus();
                const id = remove.dataset.set;
                const set = state.sets.find(item => item.id === id);
                if (!set || !confirm(`删除「${set.name}」？里面的模块会变成未放入组。`)) return;
                state.sets = state.sets.filter(item => item.id !== id);
                state.groups.forEach(group => {
                    if (group.setId === id) group.setId = '';
                });
                pickedSets.delete(id);
                persist();
                render();
                return;
            }
            if (event.target.closest('[data-action="add-set"]')) {
                const id = 'set_' + Date.now();
                state.sets.push({ id, name: '组' + (state.sets.length + 1) });
                pickedSets = new Set([id]);
                persist();
                render();
                const name = document.querySelector(`.chip[data-set="${id}"] .set-name`);
                if (name) {
                    name.contentEditable = 'true';
                    name.focus();
                    const range = document.createRange();
                    range.selectNodeContents(name);
                    const selection = window.getSelection();
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
                return;
            }
            if (event.target.classList.contains('set-name') && event.target.isContentEditable) return;
            const chip = event.target.closest('.chip');
            if (!chip) return;
            if (state.activeTab === 'qa-emails') {
                if (chip.dataset.preset) {
                    const preset = PRESETS.find(item => item.id === chip.dataset.preset);
                    if (!preset) return;
                    const exact = preset.platforms.length === picked.size && preset.platforms.every(id => picked.has(id));
                    picked = exact ? new Set() : new Set(preset.platforms);
                } else if (chip.dataset.platform === 'all') {
                    if (picked.size === PLATFORMS.length) picked.clear();
                    else PLATFORMS.forEach(platform => picked.add(platform.id));
                } else if (picked.has(chip.dataset.platform)) {
                    picked.delete(chip.dataset.platform);
                } else {
                    picked.add(chip.dataset.platform);
                }
                renderChips();
                board.querySelectorAll('.qa-card').forEach(card => {
                    card.classList.toggle('picked', picked.has(card.dataset.platform));
                });
                return;
            }
            if (chip.dataset.set === 'all') {
                if (pickedSets.size === state.sets.length) pickedSets.clear();
                else pickedSets = new Set(state.sets.map(set => set.id));
            } else if (chip.dataset.set) {
                const id = chip.dataset.set;
                if (pickedSets.has(id)) pickedSets.delete(id);
                else pickedSets.add(id);
            }
            render();
        });

        document.getElementById('chips').addEventListener('focusout', event => {
            const name = event.target;
            if (!name.classList || !name.classList.contains('set-name') || !name.isContentEditable) return;
            const set = state.sets.find(item => item.id === name.closest('.chip').dataset.set);
            if (!set) return;
            set.name = name.textContent.trim() || '未命名组';
            name.contentEditable = 'false';
            persist();
            renderChips();
        });

        document.getElementById('chips').addEventListener('keydown', event => {
            if (!event.target.classList.contains('set-name') || !event.target.isContentEditable) return;
            if (event.key === 'Enter') {
                event.preventDefault();
                event.target.blur();
            }
        });

        copySelectedBtn.addEventListener('click', () => {
            if (state.activeTab === 'qa-emails') {
                const list = [];
                PLATFORMS.forEach(platform => {
                    if (picked.has(platform.id)) list.push(...emailsFromHtml(state.qa[platform.id]));
                });
                if (!list.length) {
                    showMessage({ msg: '没有找到邮箱', type: 'warning' });
                    return;
                }
                writeClipboard(list.join(',')).then(() => {
                    showMessage({ msg: `已复制 ${list.length} 个邮箱`, type: 'success' });
                }).catch(() => showMessage({ msg: '复制失败', type: 'error' }));
                return;
            }
            const chunks = [];
            state.groups.forEach(group => {
                if (!pickedSets.has(group.setId)) return;
                group.notes.forEach(html => {
                    const text = payloadFromHtml(html);
                    if (text) chunks.push(text);
                });
            });
            if (!chunks.length) {
                showMessage({ msg: '所选组里没有内容', type: 'warning' });
                return;
            }
            writeClipboard(chunks.join('\n')).then(() => {
                showMessage({ msg: `已复制 ${chunks.length} 条`, type: 'success' });
            }).catch(() => showMessage({ msg: '复制失败', type: 'error' }));
        });

        board.addEventListener('click', event => {
            const action = event.target.closest('[data-action]');
            if (action) {
                event.stopPropagation();
                if (action.dataset.action === 'menu') {
                    toggleMenu(action);
                    return;
                }
                closeMenus();
                const group = action.closest('.group');
                const note = action.closest('.note');
                const card = action.closest('.qa-card');
                if (action.dataset.action === 'rename') {
                    beginEdit(group.querySelector('.group-title'));
                } else if (action.dataset.action === 'delete-group') {
                    if (confirm('确定删除这个模块和里面的便签吗？')) {
                        state.groups.splice(Number(group.dataset.gi), 1);
                        persist();
                        render();
                    }
                } else if (action.dataset.action === 'add-note') {
                    const gi = Number(group.dataset.gi);
                    state.groups[gi].notes.push('');
                    persist();
                    focusAfterRender = `.note[data-gi="${gi}"][data-ni="${state.groups[gi].notes.length - 1}"] .note-body`;
                    render();
                } else if (action.dataset.action === 'add-group') {
                    const setId = pickedSets.size === 1 ? [...pickedSets][0] : (state.sets[0] ? state.sets[0].id : '');
                    state.groups.push({ title: '新模块', notes: [''], setId });
                    persist();
                    focusAfterRender = `.group[data-gi="${state.groups.length - 1}"] .group-title`;
                    render();
                } else if (action.dataset.action === 'assign') {
                    const setId = pickedSets.size === 1 ? [...pickedSets][0] : '';
                    if (!setId) return;
                    state.groups[Number(action.dataset.gi)].setId = setId;
                    persist();
                    render();
                } else if (action.dataset.action === 'edit') {
                    beginEdit(note.querySelector('.note-body'));
                } else if (action.dataset.action === 'delete-note') {
                    if (confirm('确定删除这条便签吗？')) {
                        state.groups[Number(note.dataset.gi)].notes.splice(Number(note.dataset.ni), 1);
                        persist();
                        render();
                    }
                } else if (action.dataset.action === 'expand') {
                    const open = note.classList.toggle('is-open');
                    action.textContent = open ? '收起' : '展开';
                } else if (action.dataset.action === 'edit-qa') {
                    beginEdit(card.querySelector('.qa-body'));
                }
                return;
            }

            const note = event.target.closest('.note');
            if (note && !note.classList.contains('is-editing')) {
                copyNote(note);
                return;
            }
            const card = event.target.closest('.qa-card');
            if (card && !card.classList.contains('is-editing')) copyPlatform(card.dataset.platform, card);
        });

        board.addEventListener('change', event => {
            const select = event.target.closest('[data-action="move-set"]');
            if (!select) return;
            state.groups[Number(select.closest('.group').dataset.gi)].setId = select.value;
            persist();
            render();
        });

        board.addEventListener('focusout', event => {
            const body = event.target;
            if (body.isContentEditable) finishEdit(body, false);
        });

        board.addEventListener('keydown', event => {
            const body = event.target;
            if (!body.isContentEditable) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                finishEdit(body, true);
                body.blur();
            } else if (event.key === 'Enter' && (body.classList.contains('group-title') || event.metaKey || event.ctrlKey)) {
                event.preventDefault();
                body.blur();
            }
        });

        board.addEventListener('dragstart', event => {
            const grip = event.target.closest('.grip');
            if (!grip) return;
            dragIndex = Number(grip.closest('.group').dataset.gi);
            grip.closest('.group').classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', String(dragIndex));
        });

        board.addEventListener('dragend', () => {
            dragIndex = null;
            board.querySelectorAll('.group').forEach(group => group.classList.remove('dragging', 'drag-above', 'drag-below'));
        });

        board.addEventListener('dragover', event => {
            const group = event.target.closest('.group');
            if (!group || dragIndex === null) return;
            event.preventDefault();
            const rect = group.getBoundingClientRect();
            const before = event.clientY < rect.top + rect.height / 2;
            board.querySelectorAll('.group').forEach(item => item.classList.remove('drag-above', 'drag-below'));
            group.classList.add(before ? 'drag-above' : 'drag-below');
        });

        board.addEventListener('drop', event => {
            const group = event.target.closest('.group');
            if (!group || dragIndex === null) return;
            event.preventDefault();
            const target = Number(group.dataset.gi);
            if (target === dragIndex) return;
            const rect = group.getBoundingClientRect();
            const before = event.clientY < rect.top + rect.height / 2;
            const [moved] = state.groups.splice(dragIndex, 1);
            let insertAt = target;
            if (dragIndex < target) insertAt--;
            if (!before) insertAt++;
            state.groups.splice(insertAt, 0, moved);
            dragIndex = null;
            persist();
            render();
            showMessage({ msg: '顺序已更新', type: 'success' });
        });

        document.addEventListener('keydown', event => {
            if (event.key === '/' && document.activeElement !== searchInput && !event.target.isContentEditable) {
                event.preventDefault();
                searchInput.focus();
            }
        });

        load();
        render();
    </script>
</body>

</html>
