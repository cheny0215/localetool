<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本对比工具</title>
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="stylesheet" href="../../common/layui/css/layui.css" />
    <script src="../../common/layui/layui.js"></script>
    <link rel="stylesheet" href="../../common/codemirror/codemirror.min.css">
    <script src="../../common/components/ShowMessage.js" defer></script>
    <script src="../../common/components/Loading.js" defer></script>

    <style>
        :root {
            --cd-bg: #f5f6f8;
            --cd-surface: #ffffff;
            --cd-border: #e5e7eb;
            --cd-border-strong: #d1d5db;
            --cd-text: #1f2937;
            --cd-text-2: #6b7280;
            --cd-text-3: #9ca3af;
            --cd-primary: #2563eb;
            --cd-primary-hover: #1d4ed8;
            --cd-red: #dc2626;
            --cd-red-bg: #fee2e2;
            --cd-red-mark: #fecaca;
            --cd-green: #16a34a;
            --cd-green-bg: #dcfce7;
            --cd-green-mark: #bbf7d0;
            --cd-radius: 10px;
            --cd-mono: "SF Mono", Menlo, Monaco, Consolas, "Courier New", monospace;
        }

        body {
            margin: 0;
            background: var(--cd-bg);
            color: var(--cd-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
        }

        .page {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* 顶部工具栏 */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0 16px;
            background: var(--cd-bg);
        }

        .toolbar-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .toolbar-title h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--cd-text);
        }

        .toolbar-title span {
            font-size: 12px;
            color: var(--cd-text-3);
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 14px;
            border: 1px solid var(--cd-border-strong);
            border-radius: 8px;
            background: var(--cd-surface);
            color: var(--cd-text);
            font-size: 13px;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--cd-text-3);
            background: #f9fafb;
        }

        .btn .layui-icon {
            font-size: 14px;
        }

        .btn.is-active {
            border-color: var(--cd-primary);
            color: var(--cd-primary);
            background: #eff6ff;
        }

        .btn-primary {
            border-color: var(--cd-primary);
            background: var(--cd-primary);
            color: #fff;
            font-weight: 500;
            padding: 0 18px;
        }

        .btn-primary:hover {
            border-color: var(--cd-primary-hover);
            background: var(--cd-primary-hover);
        }

        .btn-primary kbd {
            font-family: inherit;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .2);
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--cd-border-strong);
            margin: 0 4px;
        }

        /* 编辑区 */
        .editors {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--cd-surface);
            border: 1px solid var(--cd-border);
            border-radius: var(--cd-radius);
            overflow: hidden;
            transition: border-color .15s, box-shadow .15s;
        }

        .pane:focus-within {
            border-color: #93c5fd;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .08);
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 44px;
            padding: 0 8px 0 14px;
            border-bottom: 1px solid var(--cd-border);
            background: #fafafa;
        }

        .pane-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        .pane-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .pane-left .dot { background: var(--cd-red); }
        .pane-right .dot { background: var(--cd-green); }

        .pane-meta {
            font-weight: 400;
            font-size: 12px;
            color: var(--cd-text-3);
        }

        .pane-tools {
            display: flex;
            gap: 2px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--cd-text-2);
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        .icon-btn:hover {
            background: #eef0f3;
            color: var(--cd-text);
        }

        .icon-btn.danger:hover {
            background: var(--cd-red-bg);
            color: var(--cd-red);
        }

        .icon-btn .layui-icon {
            font-size: 16px;
        }

        .swap-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 5;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border: 1px solid var(--cd-border-strong);
            border-radius: 50%;
            background: var(--cd-surface);
            color: var(--cd-text-2);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
            cursor: pointer;
            transition: color .15s, border-color .15s;
        }

        .swap-btn:hover {
            color: var(--cd-primary);
            border-color: var(--cd-primary);
        }

        .CodeMirror {
            height: 46vh;
            min-height: 300px;
            font-family: var(--cd-mono);
            font-size: 13px;
            line-height: 1.6;
        }

        .CodeMirror-gutters {
            border-right: 1px solid #f0f0f0;
            background: #fcfcfc;
        }

        .CodeMirror-linenumber {
            color: #c0c4cc;
        }

        .CodeMirror-placeholder {
            color: var(--cd-text-3) !important;
        }

        /* 结果区 */
        .result {
            margin-top: 20px;
            background: var(--cd-surface);
            border: 1px solid var(--cd-border);
            border-radius: var(--cd-radius);
        }

        .result-header {
            position: sticky;
            top: var(--toolbar-h, 62px);
            z-index: 4;
            border-radius: var(--cd-radius) var(--cd-radius) 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 48px;
            padding: 0 14px;
            border-bottom: 1px solid var(--cd-border);
            background: #fafafa;
        }

        .result-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-header h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
        }

        .stat {
            display: inline-flex;
            align-items: center;
            height: 22px;
            padding: 0 8px;
            border-radius: 11px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--cd-mono);
        }

        .stat-removed {
            background: var(--cd-red-bg);
            color: var(--cd-red);
        }

        .stat-added {
            background: var(--cd-green-bg);
            color: var(--cd-green);
        }

        .result-header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-counter {
            min-width: 56px;
            text-align: center;
            font-size: 12px;
            font-family: var(--cd-mono);
            color: var(--cd-text-2);
        }

        .nav-hint {
            font-size: 12px;
            color: var(--cd-text-3);
            margin-right: 6px;
        }

        .diff-output {
            padding: 16px 20px;
            min-height: 160px;
            font-family: var(--cd-mono);
            font-size: 13px;
            line-height: 1.8;
            color: var(--cd-text);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-added,
        .diff-removed {
            border-radius: 3px;
            padding: 1px 0;
            transition: box-shadow .15s;
        }

        .diff-added {
            background: var(--cd-green-mark);
            color: #14532d;
        }

        .diff-removed {
            background: var(--cd-red-mark);
            color: #7f1d1d;
            text-decoration: line-through;
            text-decoration-color: rgba(127, 29, 29, .45);
        }

        .diff-current {
            box-shadow: 0 0 0 2px var(--cd-primary);
        }

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 40px 0;
            font-family: inherit;
            color: var(--cd-text-3);
            white-space: normal;
        }

        .empty .layui-icon {
            font-size: 36px;
            color: #d1d5db;
        }

        .empty.is-same .layui-icon {
            color: var(--cd-green);
        }

        .empty.is-same {
            color: var(--cd-text-2);
        }

        .back-top {
            position: fixed;
            right: 32px;
            bottom: 32px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--cd-primary);
            color: #fff;
            box-shadow: 0 6px 16px rgba(37, 99, 235, .35);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px);
            transition: opacity .2s, transform .2s, visibility .2s, background .15s, box-shadow .15s;
        }

        .back-top.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .back-top .layui-icon {
            font-size: 22px;
            font-weight: 700;
        }

        .back-top:hover {
            background: var(--cd-primary-hover);
            box-shadow: 0 8px 20px rgba(37, 99, 235, .45);
            transform: translateY(-2px);
        }

        /* 差异列表弹窗 */
        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .diff-table th,
        .diff-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }

        .diff-table th {
            position: sticky;
            top: 0;
            background: #fafafa;
            color: var(--cd-text-2);
            font-weight: 500;
        }

        .diff-table td:first-child,
        .diff-table th:first-child {
            width: 56px;
            color: var(--cd-text-3);
            font-family: var(--cd-mono);
        }

        .diff-table td:nth-child(2),
        .diff-table th:nth-child(2) {
            width: 80px;
        }

        .diff-table td:last-child {
            font-family: var(--cd-mono);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-table tbody tr {
            cursor: pointer;
        }

        .diff-table tbody tr:hover {
            background: #eff6ff;
        }

        @media (max-width: 860px) {
            .toolbar {
                flex-direction: column;
                align-items: flex-start;
                position: static;
            }

            .editors {
                grid-template-columns: 1fr;
            }

            .swap-btn {
                transform: translate(-50%, -50%) rotate(90deg);
            }

            .result-header {
                position: static;
                flex-wrap: wrap;
                padding: 8px 14px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="toolbar" id="compareTool">
            <div class="toolbar-title">
                <h1>文本对比</h1>
                <span>逐词比较两段文本的差异</span>
            </div>
            <div class="toolbar-actions">
                <button class="btn" onclick="readSessionText()" title="读取 session 中保存的新旧 HTML">
                    <i class="layui-icon layui-icon-download-circle"></i>读取 session
                </button>
                <button class="btn is-active" id="wordWrapBtn" onclick="wordWrap()">
                    <i class="layui-icon layui-icon-align-left"></i>自动换行
                </button>
                <button class="btn is-active" id="ignoreSpaceBtn" onclick="toggleIgnoreSpace()" title="不标记仅由空格、缩进、换行造成的差异">
                    <i class="layui-icon layui-icon-fonts-clear"></i>忽略空白差异
                </button>
                <button class="btn" onclick="clearText()">
                    <i class="layui-icon layui-icon-refresh"></i>清空
                </button>
                <span class="divider"></span>
                <button class="btn btn-primary" onclick="compare()">
                    开始对比 <kbd id="shortcutKey">Ctrl ↵</kbd>
                </button>
            </div>
        </header>

        <section class="editors">
            <div class="pane pane-left">
                <div class="pane-header">
                    <div class="pane-title">
                        <span class="dot"></span>原始文本
                        <span class="pane-meta" id="meta1">0 行 · 0 字符</span>
                    </div>
                    <div class="pane-tools">
                        <button class="icon-btn" title="复制" onclick="copyText(1)"><i class="layui-icon layui-icon-file"></i></button>
                        <button class="icon-btn danger" title="清空" onclick="delText(1)"><i class="layui-icon layui-icon-delete"></i></button>
                    </div>
                </div>
                <textarea id="code1"></textarea>
            </div>

            <button class="swap-btn" title="交换左右文本" onclick="swapText()">
                <i class="layui-icon layui-icon-transfer"></i>
            </button>

            <div class="pane pane-right">
                <div class="pane-header">
                    <div class="pane-title">
                        <span class="dot"></span>修改后文本
                        <span class="pane-meta" id="meta2">0 行 · 0 字符</span>
                    </div>
                    <div class="pane-tools">
                        <button class="icon-btn" title="复制" onclick="copyText(2)"><i class="layui-icon layui-icon-file"></i></button>
                        <button class="icon-btn danger" title="清空" onclick="delText(2)"><i class="layui-icon layui-icon-delete"></i></button>
                    </div>
                </div>
                <textarea id="code2"></textarea>
            </div>
        </section>

        <section class="result">
            <div class="result-header">
                <div class="result-header-left">
                    <h2 id="compareResult">对比结果</h2>
                    <span class="stat stat-removed" title="删除处数">−<span id="text_icon1">0</span></span>
                    <span class="stat stat-added" title="新增处数">+<span id="text_icon2">0</span></span>
                </div>
                <div class="result-header-right">
                    <span class="nav-hint">↑ ↓ 键切换差异</span>
                    <button class="icon-btn" title="上一处差异" onclick="navigateDiff('prev')"><i class="layui-icon layui-icon-up"></i></button>
                    <span class="nav-counter" id="navCounter">– / –</span>
                    <button class="icon-btn" title="下一处差异" onclick="navigateDiff('next')"><i class="layui-icon layui-icon-down"></i></button>
                    <span class="divider"></span>
                    <button class="btn" lay-on="page"><i class="layui-icon layui-icon-list"></i>差异列表</button>
                </div>
            </div>
            <div id="diff-output" class="diff-output"></div>
        </section>
    </div>

    <button class="back-top" id="backTop" title="回到顶部" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
        <i class="layui-icon layui-icon-top"></i>
    </button>

    <script src="../../common/codemirror/codemirror.min.js"></script>
    <script src="../../common/codemirror/mode/javascript/javascript.min.js"></script>
    <script src="../../common/codemirror/addon/display/placeholder.min.js"></script>
    <script>
        const diffOutput = document.querySelector('#diff-output')
        const text_icon1 = document.querySelector('#text_icon1')
        const text_icon2 = document.querySelector('#text_icon2')
        const navCounter = document.querySelector('#navCounter')
        const wordWrapBtn = document.querySelector('#wordWrapBtn')

        const isMac = /Mac|iPhone|iPad/.test(navigator.platform)
        document.querySelector('#shortcutKey').textContent = isMac ? '⌘ ↵' : 'Ctrl ↵'

        const EMPTY_HTML = `<div class="empty"><i class="layui-icon layui-icon-tips"></i>在上方输入两段文本，点击「开始对比」查看差异</div>`
        const SAME_HTML = `<div class="empty is-same"><i class="layui-icon layui-icon-ok-circle"></i>两段文本完全一致</div>`

        let diffArr = []

        const editorOptions = {
            lineNumbers: true,
            mode: "javascript",
            lineWrapping: true,
        }
        const editor1 = CodeMirror.fromTextArea(document.getElementById("code1"), {
            ...editorOptions,
            placeholder: '粘贴原始文本…',
        });
        const editor2 = CodeMirror.fromTextArea(document.getElementById("code2"), {
            ...editorOptions,
            placeholder: '粘贴修改后的文本…',
        });

        function updateMeta(editor, el) {
            const value = editor.getValue()
            const lines = value ? editor.lineCount() : 0
            el.textContent = `${lines} 行 · ${value.length} 字符`
        }
        editor1.on('change', () => updateMeta(editor1, document.querySelector('#meta1')))
        editor2.on('change', () => updateMeta(editor2, document.querySelector('#meta2')))

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function resetResult() {
            diffArr = []
            text_icon1.textContent = '0'
            text_icon2.textContent = '0'
            diffOutput.innerHTML = EMPTY_HTML
            initDiffNavigation()
        }

        function clearText() {
            editor1.setValue('')
            editor2.setValue('')
            resetResult()
        }

        function delText(num) {
            (num == 1 ? editor1 : editor2).setValue('')
            resetResult()
            showMessage({ msg: '已清空', type: 'error', delay: 500, isTransition: false })
        }

        function copyText(num) {
            navigator.clipboard.writeText((num == 1 ? editor1 : editor2).getValue())
            showMessage({ msg: '已复制', type: 'info', delay: 500, isTransition: false })
        }

        function swapText() {
            const text1 = editor1.getValue()
            editor1.setValue(editor2.getValue())
            editor2.setValue(text1)
            if (diffArr.length || diffOutput.querySelector('.is-same')) compare()
        }

        function readSessionText() {
            const json_compareObj = localStorage.getItem('cy_outputButton_current_html')
            if (!json_compareObj) {
                showMessage({ msg: '没有可读取的 session 数据', type: 'error' })
                return
            }
            const compareObj = JSON.parse(json_compareObj)
            editor1.setValue(compareObj.oldHtml)
            editor2.setValue(compareObj.newHtml)
            compare()
            showMessage({ msg: '读取session数据成功', type: 'success' })
        }

        let diffWorker = null
        let diffRequestId = 0
        const pendingDiffs = new Map()

        try {
            diffWorker = new Worker('./diff.worker.js')
            diffWorker.onmessage = (e) => {
                const pending = pendingDiffs.get(e.data.id)
                if (!pending) return
                pendingDiffs.delete(e.data.id)
                pending.resolve(e.data.diff)
            }
            diffWorker.onerror = (e) => {
                e.preventDefault()
                diffWorker.terminate()
                diffWorker = null
                pendingDiffs.forEach(({ text1, text2, resolve }) => resolve(diffOnMainThread(text1, text2)))
                pendingDiffs.clear()
            }
        } catch (err) {
            // file:// 协议下浏览器禁止创建 Worker
            diffWorker = null
            console.log('file:// 协议下浏览器禁止创建 Worker');
            
        }

        function loadDiffLib() {
            if (window.Diff) return Promise.resolve()
            return new Promise((resolve, reject) => {
                const script = document.createElement('script')
                script.src = '../../common/jsdiff/diff.min.js'
                script.onload = resolve
                script.onerror = reject
                document.head.appendChild(script)
            })
        }

        async function diffOnMainThread(text1, text2) {
            await loadDiffLib()
            await new Promise(resolve => setTimeout(resolve, 0))
            return Diff.diffWords(text1, text2)
        }

        function runDiff(id, text1, text2) {
            if (!diffWorker) return diffOnMainThread(text1, text2)
            return new Promise((resolve) => {
                pendingDiffs.set(id, { text1, text2, resolve })
                diffWorker.postMessage({ id, text1, text2 })
            })
        }

        async function compare() {
            const requestId = ++diffRequestId
            const text1 = editor1.getValue();
            const text2 = editor2.getValue();

            LoadingModule.show()
            let diff
            try {
                diff = await runDiff(requestId, text1, text2)
            } catch (err) {
                showMessage({ msg: '对比失败：差异库加载失败', type: 'error' })
                return
            } finally {
                if (requestId === diffRequestId) LoadingModule.hide()
            }
            if (requestId !== diffRequestId) return

            diffArr = []

            let addedCount = 0
            let removedCount = 0
            let diffHtml = diff.map(function (part) {
                const value = escapeHtml(part.value)
                if (ignoreSpace && (part.added || part.removed) && !part.value.trim()) {
                    return part.added ? value : ''
                }
                if (part.added) {
                    addedCount++
                    diffArr.push({ added: value })
                    return `<span class="diff-added">${value}</span>`
                }
                if (part.removed) {
                    removedCount++
                    diffArr.push({ removed: value })
                    return `<span class="diff-removed">${value}</span>`
                }
                return value
            }).join('');

            text_icon1.textContent = removedCount
            text_icon2.textContent = addedCount

            if (!editor1.getValue() && !editor2.getValue()) {
                diffHtml = EMPTY_HTML
            } else if (!addedCount && !removedCount) {
                diffHtml = SAME_HTML
            }
            showMessage({ msg: '对比完成！', type: 'success' })
            diffOutput.innerHTML = diffHtml;
            initDiffNavigation();
        }

        function wordWrap() {
            const wrap = !editor1.getOption('lineWrapping')
            editor1.setOption('lineWrapping', wrap)
            editor2.setOption('lineWrapping', wrap)
            wordWrapBtn.classList.toggle('is-active', wrap)
        }

        let ignoreSpace = true
        function toggleIgnoreSpace() {
            ignoreSpace = !ignoreSpace
            document.querySelector('#ignoreSpaceBtn').classList.toggle('is-active', ignoreSpace)
            if (editor1.getValue() || editor2.getValue()) compare()
        }

        layui.use(function () {
            var layer = layui.layer;
            var util = layui.util;
            util.on('lay-on', {
                page: function () {
                    if (!diffArr.length) {
                        showMessage({ msg: '暂无差异', type: 'info' })
                        return
                    }
                    const rows = diffArr.map((item, index) => {
                        const isAdded = 'added' in item
                        return `<tr data-index="${index}" title="点击跳转到该处差异">
                                <td>${index + 1}</td>
                                <td><span class="stat ${isAdded ? 'stat-added' : 'stat-removed'}">${isAdded ? '新增' : '删除'}</span></td>
                                <td><span class="${isAdded ? 'diff-added' : 'diff-removed'}">${isAdded ? item.added : item.removed}</span></td>
                            </tr>`;
                    }).join('');
                    const tableHtml = `<table class="diff-table">
                                    <thead>
                                        <tr><th>#</th><th>类型</th><th>内容</th></tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>`;

                    const layerIndex = layer.open({
                        type: 1,
                        title: `差异列表（${diffArr.length} 处）· 点击行跳转`,
                        area: ['820px', '520px'],
                        shadeClose: true,
                        content: tableHtml,
                        success: function (layero) {
                            layero[0].querySelector('.diff-table tbody').addEventListener('click', (e) => {
                                const row = e.target.closest('tr[data-index]')
                                if (!row) return
                                layer.close(layerIndex)
                                goToDiff(Number(row.dataset.index))
                            })
                        }
                    });
                },
            })
        })

        const toolbar = document.querySelector('.toolbar')
        new ResizeObserver(() => {
            document.documentElement.style.setProperty('--toolbar-h', `${toolbar.offsetHeight}px`)
        }).observe(toolbar)

        const backTop = document.querySelector('#backTop')
        window.addEventListener('scroll', function () {
            backTop.classList.toggle('is-visible', window.scrollY >= 400)
        });

        let currentDiffIndex = -1;
        let diffElements = [];

        function updateNavCounter() {
            navCounter.textContent = diffElements.length
                ? `${currentDiffIndex + 1 || '–'} / ${diffElements.length}`
                : '– / –'
        }

        function initDiffNavigation() {
            diffElements = diffOutput.querySelectorAll('.diff-added, .diff-removed');
            currentDiffIndex = -1;
            updateNavCounter()
        }

        function goToDiff(index) {
            if (!diffElements[index]) return;

            if (currentDiffIndex >= 0) {
                diffElements[currentDiffIndex].classList.remove('diff-current');
            }
            currentDiffIndex = index;

            const currentElement = diffElements[currentDiffIndex];
            currentElement.classList.add('diff-current');
            currentElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            updateNavCounter()
        }

        function navigateDiff(direction) {
            if (diffElements.length === 0) return;
            const total = diffElements.length
            goToDiff(direction === 'next'
                ? (currentDiffIndex + 1) % total
                : (currentDiffIndex <= 0 ? total - 1 : currentDiffIndex - 1))
        }

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                compare();
                return;
            }
            // 焦点在编辑器或输入框内时保留方向键的原生行为
            if (e.target.closest('.CodeMirror, input, textarea')) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                navigateDiff('next');
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                navigateDiff('prev');
            }
        });

        resetResult()
    </script>

</body>

</html>
